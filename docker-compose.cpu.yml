services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ocr-cpu-llama-server
    command:
      - -hf
      - bartowski/ATH-MaaS_OvisOCR2-GGUF:Q4_K_M
      - --n-gpu-layers
      - "0"
      - --no-mmproj-offload
      - --parallel
      - "1"
      - --ctx-size
      - "8192"
      - --threads
      - "8"
      - --threads-batch
      - "8"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "43721:8080"
    volumes:
      - llama-cache:/root/.cache
    restart: unless-stopped

  ocr-ui:
    build:
      context: https://github.com/necdetoskay/ocr-cpu-lab.git#main
      dockerfile: Dockerfile.gguf-app
    container_name: ocr-cpu-ui
    environment:
      LLAMA_SERVER_URL: http://llama-server:8080
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7861"
      OCR_DEFAULT_MAX_TOKENS: "2048"
      OCR_RETRY_MAX_TOKENS: "4096"
    ports:
      - "44387:7861"
    depends_on:
      - llama-server
    restart: unless-stopped

  paddle-ui:
    build:
      context: https://github.com/necdetoskay/ocr-cpu-lab.git#main
      dockerfile: Dockerfile.paddle
    container_name: ocr-cpu-paddle-ui
    environment:
      PADDLE_GRADIO_PORT: "7862"
      PADDLE_PDX_MODEL_SOURCE: BOS
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
    ports:
      - "44631:7862"
    volumes:
      - paddle-cache:/root/.paddlex
      - paddle-hf-cache:/root/.cache
    shm_size: "4gb"
    restart: unless-stopped

volumes:
  llama-cache:
  paddle-cache:
  paddle-hf-cache:
